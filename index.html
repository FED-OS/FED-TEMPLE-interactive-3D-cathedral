<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FED-TEMPLE — The Digital Monument</title>
  <meta name="description" content="Transform your GitHub contribution history into an interactive 3D cathedral. Browser-native, no API keys, no server. A FED-OS project." />

  <!-- Open Graph -->
  <meta property="og:title" content="FED-TEMPLE — The Digital Monument" />
  <meta property="og:description" content="Turn your GitHub commits into a 3D cathedral. Bricks = commits, golden tiles = stars, pillars = forks, stained glass = languages." />
  <meta property="og:image" content="social-image.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="social-image.png" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%95%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
  <!-- lz-string: load as a classic script so it exposes a global `LZString`.
       Importing the CDN build as an ES module throws ("no default export"),
       which kills the whole app before it boots. Classic global is the
       browser-native, zero-dependency fix. -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>
<body>

  <!-- ASCII loader (Hidden Gem #8) -->
  <div id="ascii-loader">
<div id="ascii-art"></div>
<div style="margin-top:20px;color:var(--text-dim)" id="ascii-status">Initializing WebGL forge...</div>
  </div>

  <!-- Main UI (slimmed further — Phase 9) -->
  <div id="ui">
    <h1><span class="logo">🛕</span> FED-TEMPLE</h1>

    <div class="input-row">
      <input id="username" value="FED-OS" placeholder="GitHub username" autocomplete="off" spellcheck="false" />
      <button id="buildBtn">⛏</button>
    </div>

    <div class="btn-row">
      <button id="demoBtn" class="secondary">demo</button>
      <button id="cancelBtn" class="danger" disabled>cancel</button>
      <button id="toggleUi" class="secondary">hide</button>
    </div>

    <div id="progress-wrap">
      <div id="progress-text">Ready.</div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="stats">
      <h2 id="statsToggle">// Blueprint ▾</h2>
      <div class="stat-row"><span>commits</span><span class="v" id="s-commits">0</span></div>
      <div class="stat-row"><span>stars</span><span class="v" id="s-stars">0</span></div>
      <div class="stat-row"><span>forks</span><span class="v" id="s-forks">0</span></div>
      <div class="stat-row"><span>repos</span><span class="v" id="s-repos">0</span></div>
      <div class="stat-row"><span>languages</span><span class="v" id="s-langs">0</span></div>
      <div id="lang-pills"></div>
    </div>
  </div>

  <!-- Hint badge: tells the user about drag + dblclick -->
  <div id="hint">hold a brick to move · double-click for repo tree</div>

  <!-- Commit modal -->
  <div id="modal">
    <div class="m-head">
      <div class="m-tag">// commit brick</div>
      <button class="m-close" id="modalClose">✕</button>
    </div>
    <div class="m-msg" id="modalMsg">—</div>
    <div class="m-meta">
      <span id="modalRepo"></span>
      <span id="modalDate"></span>
      <a id="modalLink" href="#" target="_blank" rel="noopener">view on GitHub →</a>
    </div>
  </div>

  <!-- Repo-tree panel (Phase 8: double-click a brick) -->
  <div id="tree-panel">
    <div class="t-head">
      <div>
        <div class="t-title"><span class="repo-icon">📁</span><span id="treeRepoName">—</span></div>
        <div class="t-sub" id="treeSub">—</div>
      </div>
      <button class="t-close" id="treeClose">✕</button>
    </div>
    <div class="t-body" id="treeBody">—</div>
    <div class="t-footer">
      <a id="treeLink" class="t-link" href="#" target="_blank" rel="noopener">view repo on GitHub →</a>
    </div>
  </div>

  <!-- Bottom toolbar (trimmed to 4 essentials — Phase 9) -->
  <div id="toolbar">
    <button id="resetCam" title="Reset camera (R)">🏠</button>
    <button id="autoRotate" title="Auto-orbit">🔄</button>
    <button id="snapshot" title="Download PNG (S)">📸</button>
    <button id="shareLink" title="Copy shareable link">🔗</button>
    <button id="downloadHtml" title="Download standalone HTML">💾</button>
    <button id="toggleTree" class="secondary" title="Show repo tree of last brick">🌳</button>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- 3D canvas mounts here -->
  <div id="canvas-container"></div>

  <!-- Three.js via import map (CDN, no build step) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="scripts/temple.js"></script>
</body>
</html>
