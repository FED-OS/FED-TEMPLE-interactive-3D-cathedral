<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FED-TEMPLE — The Digital Monument</title>
  <meta name="description" content="Transform your GitHub contribution history into an interactive 3D cathedral. Browser-native, no API keys, no server. A FED-OS project." />

  <!-- Open Graph -->
  <meta property="og:title" content="FED-TEMPLE — The Digital Monument" />
  <meta property="og:description" content="Turn your GitHub commits into a 3D cathedral. Bricks = commits, golden tiles = stars, pillars = forks, stained glass = languages." />
  <meta property="og:image" content="social-image.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="social-image.png" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%95%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>

  <!-- ASCII loader (Hidden Gem #8) -->
  <div id="ascii-loader">
<div id="ascii-art"></div>
<div style="margin-top:20px;color:var(--text-dim)" id="ascii-status">Initializing WebGL forge...</div>
  </div>

  <!-- Main UI -->
  <div id="ui">
    <h1><span class="logo">🛕</span> FED-TEMPLE <span class="blink"></span></h1>

    <div class="input-row">
      <input id="username" value="FED-OS" placeholder="GitHub username" autocomplete="off" spellcheck="false" />
    </div>

    <div class="btn-grid">
      <button id="buildBtn">⛏ Build Temple</button>
      <button id="demoBtn" class="secondary">✨ Demo</button>
    </div>
    <div class="btn-grid">
      <button id="cancelBtn" class="danger" disabled>✖ Cancel</button>
      <button id="toggleUi" class="secondary">👁 Hide UI</button>
    </div>

    <div id="progress-wrap">
      <div id="progress-text">Ready.</div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="stats">
      <h2>// Blueprint</h2>
      <div class="stat-row"><span>commits → bricks</span><span class="v" id="s-commits">0</span></div>
      <div class="stat-row"><span>stars → gold</span><span class="v" id="s-stars">0</span></div>
      <div class="stat-row"><span>forks → pillars</span><span class="v" id="s-forks">0</span></div>
      <div class="stat-row"><span>repos</span><span class="v" id="s-repos">0</span></div>
      <div class="stat-row"><span>languages</span><span class="v" id="s-langs">0</span></div>
      <div id="lang-pills"></div>
    </div>
  </div>

  <!-- Commit modal -->
  <div id="modal">
    <div class="m-head">
      <div class="m-tag">// commit brick</div>
      <button class="m-close" id="modalClose">✕</button>
    </div>
    <div class="m-msg" id="modalMsg">—</div>
    <div class="m-meta">
      <span id="modalRepo"></span>
      <span id="modalDate"></span>
      <a id="modalLink" href="#" target="_blank" rel="noopener">view on GitHub →</a>
    </div>
  </div>

  <!-- Bottom toolbar -->
  <div id="toolbar">
    <button id="resetCam" title="Reset camera (R)">🏠 Home</button>
    <button id="autoRotate" title="Auto-orbit">🔄 Auto-Orbit</button>
    <button id="snapshot" title="Download PNG">📸 Snapshot</button>
    <button id="shareLink" title="Copy shareable link">🔗 Share</button>
    <button id="downloadHtml" title="Download standalone HTML">💾 Save HTML</button>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Ko-fi -->
  <div id="kofi">
    <a href="https://ko-fi.com/YOUR_USERNAME" target="_blank" rel="noopener">
      <img height="36" style="border:0px;height:36px;" src="https://ko-fi.com/img/githubbutton_sm.svg" alt="Buy Me a Coffee at ko-fi.com" />
    </a>
  </div>

  <!-- Credit -->
  <div id="credit">
    FED-TEMPLE · part of <a href="https://github.com/FED-OS" target="_blank" rel="noopener">FED-OS</a><br/>
    <span id="rate-info"></span>
  </div>

  <!-- 3D canvas mounts here -->
  <div id="canvas-container"></div>

  <!-- Three.js via import map (CDN, no build step) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "lz-string": "https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"
    }
  }
  </script>
  <script type="module" src="scripts/temple.js"></script>
</body>
</html>
