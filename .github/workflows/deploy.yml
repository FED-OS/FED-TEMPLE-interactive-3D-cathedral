name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'scripts/**'
      - 'social-image.png'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build check (no build step — static)
        run: |
          node --check scripts/temple.js
          for f in index.html styles.css scripts/temple.js social-image.png; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
