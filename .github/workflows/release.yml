name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify runtime files
        run: |
          for f in index.html styles.css scripts/temple.js social-image.png; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
      - name: Syntax check
        run: node --check scripts/temple.js

      - name: Package static artifact
        run: |
          mkdir -p dist
          zip -r dist/fed-temple-${{ steps.tag.outputs.name }}.zip \
            index.html styles.css scripts social-image.png README.md LICENSE
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fed-temple-${{ steps.tag.outputs.name }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: FED-TEMPLE ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: dist/fed-temple-${{ steps.tag.outputs.name }}.zip
