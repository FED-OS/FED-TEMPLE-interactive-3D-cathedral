name: Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  area-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            const labels = [];
            if (/^feat(\(.+\))?:/.test(title)) labels.push('enhancement');
            if (/^fix(\(.+\))?:/.test(title)) labels.push('bug');
            if (/^docs(\(.+\))?:/.test(title)) labels.push('documentation');
            if (/^perf(\(.+\))?:/.test(title)) labels.push('performance');
            if (/^chore(\(.+\))?:/.test(title)) labels.push('chore');
            if (title.includes('security') || title.includes('cve')) labels.push('security');
            if (labels.length) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                labels
              });
            }
