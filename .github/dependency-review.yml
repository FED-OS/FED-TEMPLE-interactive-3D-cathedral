name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # FED-TEMPLE has no npm/runtime deps from a lockfile (libs are CDN-pinned),
          # but this guards the Actions used in workflows and any future package.json.
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
